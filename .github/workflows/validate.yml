name: Validate

on:
  push:
    branches:
      - main
      - production
      - 'chore/**'
      - 'feature/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run mapper validation
        run: npm run test:mapper

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build